name: flow-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed commit to aggregate; defaults to the selected ref
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  package-parity:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.11'
      - name: Verify the reviewed checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run pure, GUI-bootstrap, and package regressions
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project --with pytest --with jsonschema --with tomli-w
          python -m pytest
          tests/flow_core tests/test_flow_capabilities.py
          tests/test_gui_installer_bundle.py tests/test_flow_gui_deploy.py -q
      - name: Build the release distributions
        run: uv build --sdist --wheel --out-dir dist-release
      - name: Verify wheel imports and source/wheel parity
        env:
          PYTHONPATH: src
        run: uv run --no-project python tests/flow_core/check_wheel.py dist-release
      - name: Create the package-parity manifest
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project --with tomli-w python
          scripts/flow_release_gate.py package
          --dist dist-release --checkout-sha "$EXPECTED_SHA"
          --output dist-release/package-manifest.json
      - name: Upload the verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: dist-release
          if-no-files-found: error

  licensed-ida:
    uses: ./.github/workflows/idalib-tests.yml
    with:
      release_sha: ${{ inputs.release_sha || github.sha }}
    secrets:
      container_registry_token: ${{ secrets.GITHUB_TOKEN }}

  release-aggregate:
    if: always()
    needs: [package-parity, licensed-ida]
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - name: Require every release lane
        env:
          PACKAGE_RESULT: ${{ needs.package-parity.result }}
          LICENSED_RESULT: ${{ needs.licensed-ida.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$LICENSED_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: release-package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: licensed-static-*
          path: licensed-reports
          merge-multiple: true
      - name: Combine fresh B01-B03 and protected licensed measurements
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project python scripts/run_flow_benchmarks.py
          --ida-metrics licensed-reports/benchmark-ida.json
          --expected-ida-executable-sha256 "${{ vars.IDA_93_EXECUTABLE_SHA256 }}"
          --output release-package/benchmark-report.json --require-ida
      - name: Verify aggregate build identity and licensed coverage
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project python scripts/flow_release_gate.py aggregate
          --package-manifest release-package/package-manifest.json
          --licensed-dir licensed-reports --checkout-sha "$EXPECTED_SHA"
          --normal-dir licensed-reports/normal
          --expected-ida-version 9.3
          --gui-receipt licensed-reports/gui-process.json
          --benchmark-report release-package/benchmark-report.json
          --benchmark-limits tests/flow_fixtures/manifests/benchmark-limits.json
          --expected-ida-executable-sha256 "${{ vars.IDA_93_EXECUTABLE_SHA256 }}"
          --expected-gui-executable-sha256 "${{ vars.IDA_93_GUI_EXECUTABLE_SHA256 }}"
          --output release-package/release-aggregate.json
      - name: Upload the release aggregate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-aggregate
          path: release-package
          if-no-files-found: error
