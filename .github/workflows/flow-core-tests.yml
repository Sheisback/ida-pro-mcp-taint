name: flow-core-tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure core and extraction contracts (no IDA or credentials)
        env:
          PYTHONPATH: src
        run: uv run --no-project --with pytest python -m pytest tests/flow_core -q
      - name: Lint core, adapters, and tests
        run: >-
          uv run ruff check
          src/ida_pro_mcp/flow_core
          src/ida_pro_mcp/ida_mcp/flow/extractor.py
          src/ida_pro_mcp/ida_mcp/flow/p0_probe.py
          tests/flow_core
      - name: Build wheel
        run: uv build --wheel --out-dir dist-flow-core
      - name: Import core from wheel without application dependencies
        run: uv run --no-project python tests/flow_core/check_wheel.py dist-flow-core
