name: flow-core-tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure contracts and import isolation (no IDA or credentials)
        env:
          PYTHONPATH: src
        run: uv run --no-project --with pytest python -m pytest tests/flow_core tests/test_upstream_sync.py -q
      - name: Lint core and tests
        run: uvx ruff@0.15.7 check src/ida_pro_mcp/flow_core tests/flow_core src/ida_pro_mcp/ida_mcp/flow/runtime.py src/ida_pro_mcp/idalib_server.py scripts/check_upstream_sync.py tests/test_upstream_sync.py
      - name: Build wheel
        run: uv build --wheel --out-dir dist-flow-core
      - name: Import core from wheel without application dependencies
        env:
          PYTHONPATH: src
        run: uv run --no-project python tests/flow_core/check_wheel.py dist-flow-core
