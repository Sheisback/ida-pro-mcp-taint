name: idalib-tests
on:
  # Licensed IDA jobs are opt-in; normal pushes use flow-core-tests instead.
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed commit to test; defaults to the selected ref
        required: false
        type: string
  workflow_call:
    inputs:
      release_sha:
        description: Reviewed commit shared by every release-gate job
        required: true
        type: string
    secrets:
      container_registry_token:
        description: Read-only token for the pinned licensed IDA image
        required: true

permissions:
  contents: read
  packages: read

jobs:
  image-pin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ida-version: '9.0'
            image-digest: ${{ vars.IDA_IMAGE_90_DIGEST }}
          - ida-version: '9.1'
            image-digest: ${{ vars.IDA_IMAGE_91_DIGEST }}
          - ida-version: '9.2'
            image-digest: ${{ vars.IDA_IMAGE_92_DIGEST }}
          - ida-version: '9.3'
            image-digest: ${{ vars.IDA_IMAGE_93_DIGEST }}
    steps:
      - name: Require immutable licensed image digest
        env:
          IMAGE_DIGEST: ${{ matrix.image-digest }}
        run: '[[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'
      - name: Require reviewed IDA 9.3 executable digest
        if: matrix.ida-version == '9.3'
        env:
          IDA_EXECUTABLE_SHA256: ${{ vars.IDA_93_EXECUTABLE_SHA256 }}
        run: '[[ "$IDA_EXECUTABLE_SHA256" =~ ^[0-9a-f]{64}$ ]]'
      - name: Require reviewed IDA 9.3 GUI executable digest
        if: matrix.ida-version == '9.3'
        env:
          IDA_GUI_EXECUTABLE_SHA256: ${{ vars.IDA_93_GUI_EXECUTABLE_SHA256 }}
        run: '[[ "$IDA_GUI_EXECUTABLE_SHA256" =~ ^[0-9a-f]{64}$ ]]'

  flow-ida:
    # This protected environment must require reviewer approval. Untrusted pull
    # request code is never checked out by this workflow.
    environment: licensed-ida
    needs: image-pin
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ida-version: '9.0'
            image-digest: ${{ vars.IDA_IMAGE_90_DIGEST }}
          - ida-version: '9.1'
            image-digest: ${{ vars.IDA_IMAGE_91_DIGEST }}
          - ida-version: '9.2'
            image-digest: ${{ vars.IDA_IMAGE_92_DIGEST }}
          - ida-version: '9.3'
            image-digest: ${{ vars.IDA_IMAGE_93_DIGEST }}
    container:
      image: ghcr.io/mrexodia/ida-docker/ida@${{ matrix.image-digest }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.container_registry_token || secrets.GITHUB_TOKEN }}
    env:
      EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Verify the reviewed checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run retained licensed IDA tests
        run: |
          uv run ida-mcp-test tests/crackme03.elf -q
          uv run ida-mcp-test tests/typed_fixture.elf -q
      - name: Record fresh static build-identity receipts
        run: |
          mkdir -p licensed-reports
          uv run python scripts/flow_licensed_ci.py \
            --fixture tests/crackme03.elf \
            --checkout-sha "$EXPECTED_SHA" \
            --profile X64-LE --abi sysv-amd64 --format FMT-ELF \
            --output "licensed-reports/licensed-${{ matrix.ida-version }}-crackme03.json"
          uv run python scripts/flow_licensed_ci.py \
            --fixture tests/typed_fixture.elf \
            --checkout-sha "$EXPECTED_SHA" \
            --profile X64-LE --abi sysv-amd64 --format FMT-ELF \
            --output "licensed-reports/licensed-${{ matrix.ida-version }}-typed-fixture.json"
      - name: Record current actual normal semantic receipts
        if: matrix.ida-version == '9.3'
        run: |
          test "$(zig version)" = "0.16.0-dev.1484+d0ba6642b" || \
            [[ "$(zig version)" == 0.16.* ]]
          uv run python scripts/build_flow_isa_profiles.py \
            licensed-reports/current-build
          uv run python scripts/record_flow_profile_receipts.py \
            --root "$PWD" \
            --build-manifest licensed-reports/current-build/build.json \
            --output-dir licensed-reports/current-p0 \
            --ida-executable "$(command -v idat)" \
            --repeat-final \
            --release-scope profiles/flow-release-scope.json
          uv run python scripts/record_flow_profile_semantics.py \
            --rebuilt-manifest licensed-reports/current-build/build.json \
            --build-root licensed-reports/current-build \
            --p0-root licensed-reports/current-p0 \
            --output licensed-reports/current-normal \
            --ida "$(command -v idat)"
          uv run python scripts/record_flow_profile_semantics.py \
            --rebuilt-manifest licensed-reports/current-build/build.json \
            --build-root licensed-reports/current-build \
            --p0-root licensed-reports/current-p0 \
            --output licensed-reports/current-format \
            --ida "$(command -v idat)" \
            --format-only
          uv run python scripts/record_flow_licensed_normal.py \
            --checkout-sha "$EXPECTED_SHA" \
            --ida "$(command -v idat)" \
            --expected-ida-executable-sha256 "${{ vars.IDA_93_EXECUTABLE_SHA256 }}" \
            --current-normal-dir licensed-reports/current-normal \
            --current-format-dir licensed-reports/current-format \
            --output licensed-reports/normal
      - name: Record fresh protected 5x30 licensed IDA benchmark
        if: matrix.ida-version == '9.3'
        run: |
          uv run python scripts/run_ida_flow_benchmark.py \
            --fixture tests/flow_fixtures/benchmark/p0_x86_64 \
            --profile X64-LE --abi darwin-x86_64-sysv-derived --format FMT-MACHO \
            --build-manifest tests/flow_fixtures/benchmark/build.json \
            --ida "$(command -v idat)" \
            --expected-ida-executable-sha256 "${{ vars.IDA_93_EXECUTABLE_SHA256 }}" \
            --output licensed-reports/benchmark-ida.json
      - name: Attempt isolated disposable GUI-process evidence
        if: matrix.ida-version == '9.3'
        run: |
          GUI_EXECUTABLE="$(command -v ida || printf /missing/ida)"
          uv run python scripts/record_flow_gui_ci.py \
            --fixture tests/crackme03.elf \
            --checkout-sha "$EXPECTED_SHA" \
            --ida "$GUI_EXECUTABLE" \
            --expected-ida-executable-sha256 "${{ vars.IDA_93_GUI_EXECUTABLE_SHA256 }}" \
            --output licensed-reports/gui-process.json
      - name: Upload licensed static receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: licensed-static-${{ matrix.ida-version }}
          path: licensed-reports
          if-no-files-found: error
